# Telegram-namespace apps. crashers-bot is a Laravel HTTP bot (Telegram webhook
# receiver + scheduler); home-exporter is a Prometheus-style exporter that
# ICMP-pings remote hosts and reports state to Telegram; recipes-bot turns
# social-media recipe links into Notion pages. All three source repos live
# outside the cash-track GitHub org, so their images are pulled from the upstream
# `vovanms/*` Docker Hub namespace (public, no imagePullSecrets — matches the
# K8s deployments where applicable). The cash-track org-level release workflow
# (Stage 11/12) does NOT manage these images; the operator bumps
# `versions.crashers_bot` / `versions.home_exporter` / `versions.recipes_bot`
# in `group_vars/all/main.yml` when a new upstream tag ships.

networks:
  app:
    driver: bridge
    name: cashtrack-app

services:
  crashers-bot:
    image: vovanms/crashers_bot_api:${VERSION_CRASHERS_BOT}
    restart: always
    networks: [app]
    env_file: [secrets/crashers-bot.env]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8090/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.crashers-bot.rule=Host(`crashers-bot.${DOMAIN}`)
      - traefik.http.routers.crashers-bot.entrypoints=websecure
      - traefik.http.routers.crashers-bot.tls=true
      - traefik.http.services.crashers-bot.loadbalancer.server.port=8090
      - traefik.http.routers.crashers-bot.middlewares=cloudflare-only@file
      # Replaces the K8s `crashers-bot-scheduler` CronJob (`* * * * *` running
      # `php artisan schedule:run`). Ofelia's 6-field cron: at second 0 every minute.
      - ofelia.enabled=true
      - ofelia.job-exec.scheduler.schedule=0 * * * * *
      - ofelia.job-exec.scheduler.command=php artisan schedule:run
    mem_limit: 320m
    mem_reservation: 256m
    oom_score_adj: -100

  mysql-backup-crashers:
    image: cashtrack/mysql-backup:${VERSION_MYSQL_BACKUP}
    restart: always
    networks: [app]
    env_file: [secrets/mysql-backup-crashers.env]
    depends_on:
      mysql: { condition: service_healthy }
    command: ["tail", "-f", "/dev/null"]
    labels:
      - ofelia.enabled=true
      - ofelia.job-exec.backup-crashers.schedule=0 0 * * * *
      - ofelia.job-exec.backup-crashers.command=php app.php backup
      - ofelia.job-exec.purge-old-crashers.schedule=0 0 4 * * 0
      - ofelia.job-exec.purge-old-crashers.command=php app.php clear --days=7
    mem_limit: 192m
    mem_reservation: 128m
    oom_score_adj: 0

  home-exporter:
    image: vovanms/home_exporter:${VERSION_HOME_EXPORTER}
    restart: always
    networks: [app]
    env_file: [secrets/home-exporter.env]
    # ICMP probes need raw sockets. K8s ran the pod `privileged: true`; the
    # smaller `NET_RAW` capability is enough for ping(2). Keeps the container
    # otherwise unprivileged.
    cap_add: [NET_RAW]
    volumes:
      # Rendered by ansible/roles/compose-render from
      # `home-exporter.config.yml.tpl` (Jinja → op inject). Lives under
      # `secrets/` because telegramChatId + probe host come from 1Password.
      - ./secrets/home-exporter/config.yml:/app/config/config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2112"]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.routers.home-exporter.rule=Host(`home-exporter.${DOMAIN}`)
      - traefik.http.routers.home-exporter.entrypoints=websecure
      - traefik.http.routers.home-exporter.tls=true
      - traefik.http.services.home-exporter.loadbalancer.server.port=80
      - traefik.http.routers.home-exporter.middlewares=cloudflare-only@file
    mem_limit: 128m
    mem_reservation: 96m
    oom_score_adj: 0

  recipes-bot:
    image: vovanms/recipes_bot:${VERSION_RECIPES_BOT}
    restart: always
    networks: [app]
    env_file: [secrets/recipes-bot.env]
    volumes:
      # Scratch for yt-dlp/ffmpeg. Disk-backed on purpose, NOT tmpfs: tmpfs
      # pages are charged to this container's memory cgroup, so a 200 MB video
      # in scratch would count against mem_limit twice over and OOM-kill the
      # process mid-job. /mnt/data is the block volume, directory owned by
      # uid/gid 10001 via ansible/roles/volume (see docs/DEPLOYMENT.md §3).
      - /mnt/data/recipes-bot/scratch:/tmp/recipes:rw,noexec,nosuid
      # Instagram cookie jar — not wired up yet. Add
      # `./secrets/recipes-bot/cookies.txt:/app/cookies.txt:ro` here, plus the
      # matching secret_config_files entry in group_vars/all/main.yml and
      # compose-render/defaults/main.yml, and YTDLP_COOKIES_FILE in the env
      # template, once cookies are actually provisioned in 1Password
      # (docs/DEPLOYMENT.md §3 step 1, runbook §6 "Downloads failing").
    healthcheck:
      test: ["CMD", "/usr/local/bin/recipes-bot", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.recipes-bot.rule=Host(`recipes-bot.${DOMAIN}`)
      - traefik.http.routers.recipes-bot.entrypoints=websecure
      - traefik.http.routers.recipes-bot.tls=true
      - traefik.http.services.recipes-bot.loadbalancer.server.port=8080
      - traefik.http.routers.recipes-bot.middlewares=cloudflare-only@file
    mem_limit: 512m
    mem_reservation: 192m
    oom_score_adj: -100
